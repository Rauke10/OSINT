services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: globeye:local
    container_name: globeye
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    # Hardened runtime: read-only rootfs, no privilege escalation.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - globeye-data:/data
      - ./reports:/data/reports
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  globeye-data:
