name: Trivy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "44 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t globeye:scan .
      - name: Scan (report HIGH+CRITICAL to the Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: globeye:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Fail the build on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: globeye:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
