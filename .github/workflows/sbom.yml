name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach SBOMs to the release
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - name: SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: globeye.spdx.json
      - name: CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: globeye.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: globeye.*.json
      - name: Attach SBOMs to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            globeye.spdx.json
            globeye.cdx.json
