<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOBEYE — passive OSINT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  body{background:#0f1419;color:#e6edf3}
  #cy{height:420px;background:#0b0f14;border:1px solid #272e3a;border-radius:8px}
  input,button{background:#171c24;border:1px solid #272e3a;color:#e6edf3}
</style>
</head>
<body class="font-sans">
<div x-data="globeye()" class="max-w-6xl mx-auto p-6">
  <h1 class="text-2xl font-bold">GLOBEYE
    <span class="text-sm text-gray-400">strictly passive OSINT</span></h1>

  <div class="mt-2 text-xs text-red-300 border border-red-700 bg-red-900/20
              rounded p-2">
    Authorized / educational use only. The author is not responsible for misuse.
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <input class="px-3 py-2 rounded flex-1 min-w-[220px]" placeholder="target (domain, IP, email, …)"
           x-model="target" @keydown.enter="run()">
    <input class="px-3 py-2 rounded" type="password" placeholder="X-API-Key"
           x-model="apiKey">
    <label class="flex items-center gap-1 text-sm px-2">
      <input type="checkbox" x-model="pivot"> pivot</label>
    <button class="px-4 py-2 rounded" @click="run()" :disabled="loading"
            x-text="loading ? 'Scanning…' : 'Scan'"></button>
  </div>
  <p class="text-red-400 text-sm mt-2" x-text="error"></p>

  <template x-if="result">
    <div class="mt-6">
      <div class="flex gap-3 flex-wrap">
        <template x-for="k in ['total','high','medium','low']">
          <div class="bg-[#171c24] border border-[#272e3a] rounded px-4 py-2">
            <div class="text-xl font-bold" x-text="result.summary.findings[k]"></div>
            <div class="text-xs text-gray-400" x-text="k"></div>
          </div>
        </template>
        <a class="px-4 py-2 rounded border border-[#272e3a]"
           :href="'/api/scan/'+result.scan_id+'/report'" target="_blank">
           Open HTML report ↗</a>
      </div>

      <div id="cy" class="mt-4"></div>

      <input class="px-3 py-2 rounded mt-4 w-full" placeholder="filter findings…"
             x-model="filter">
      <table class="w-full mt-2 text-sm">
        <thead class="text-gray-400 text-left">
          <tr><th class="p-2">source</th><th class="p-2">kind</th>
              <th class="p-2">value</th><th class="p-2">conf</th></tr>
        </thead>
        <tbody>
          <template x-for="f in filtered()" :key="f.source+f.kind+f.value">
            <tr class="border-t border-[#272e3a]">
              <td class="p-2" x-text="f.source"></td>
              <td class="p-2" x-text="f.kind"></td>
              <td class="p-2 break-all" x-text="f.value"></td>
              <td class="p-2" x-text="f.confidence"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </template>
</div>

<script>
function globeye(){
  return {
    target:'', apiKey:'', pivot:false, loading:false, error:'',
    result:null, filter:'',
    filtered(){ if(!this.result) return [];
      const q=this.filter.toLowerCase();
      return this.result.findings.filter(f=>
        JSON.stringify(f).toLowerCase().includes(q)); },
    async run(){
      this.error=''; this.result=null; this.loading=true;
      try{
        const r=await fetch('/api/scan',{method:'POST',
          headers:{'content-type':'application/json','X-API-Key':this.apiKey},
          body:JSON.stringify({target:this.target,pivot:this.pivot})});
        if(!r.ok){this.error='Error '+r.status+': '+(await r.text());return;}
        this.result=await r.json();
        this.$nextTick(()=>this.draw());
      }catch(e){ this.error=String(e); }
      finally{ this.loading=false; }
    },
    async draw(){
      const g=await fetch('/api/history/'+this.result.scan_id,
        {headers:{'X-API-Key':this.apiKey}}).then(r=>r.json()).catch(()=>null);
      const nodes=[{data:{id:this.result.target.value,
        label:this.result.target.value}}];
      const edges=[]; const seen=new Set([this.result.target.value]);
      this.result.findings.forEach(f=>{
        const id=f.value; if(!seen.has(id)){seen.add(id);
          nodes.push({data:{id,label:id.slice(0,40)}});}
        edges.push({data:{id:f.source+id+Math.random(),
          source:this.result.target.value,target:id}});
      });
      cytoscape({container:document.getElementById('cy'),
        elements:[...nodes,...edges],
        style:[{selector:'node',style:{'label':'data(label)',
          'background-color':'#4cc2ff','color':'#e6edf3','font-size':9}},
          {selector:'edge',style:{'line-color':'#39414f','width':1}}],
        layout:{name:'concentric'}});
    }
  };
}
</script>
</body>
</html>
