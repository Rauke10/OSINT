[project]
name = "globeye"
version = "0.1.0"
description = "GLOBEYE — strictly passive OSINT toolkit (infrastructure, identity & organizations)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rauke10" }]
keywords = ["osint", "passive", "reconnaissance", "security", "threat-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13.7",
  "httpx[socks]>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlmodel>=0.0.21",
  "structlog>=24.1",
  "jinja2>=3.1",
  "email-validator>=2.1",
  "tldextract>=5.1",
  "geoip2>=4.8",
]

[project.urls]
Homepage = "https://github.com/rauke10/osint"
Repository = "https://github.com/rauke10/osint"
Issues = "https://github.com/rauke10/osint/issues"

[project.scripts]
globeye = "globeye.__main__:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "respx>=0.21",
  "hypothesis>=6.108",
  "pre-commit>=3.7",
  "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/globeye"]

# ----------------------------------------------------------------------------
# Ruff — lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # flake8-bugbear
  "C4",            # flake8-comprehensions
  "SIM",           # flake8-simplify
  "RUF",           # ruff-specific
  "S",             # flake8-bandit (defence in depth)
  "ASYNC",         # flake8-async
  "PT",            # flake8-pytest-style
  "RET",           # flake8-return
  "PIE",           # flake8-pie
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["globeye"]

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------
# mypy — strict
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["tldextract.*", "geoip2.*", "maxminddb.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false

# ----------------------------------------------------------------------------
# pytest + coverage
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --cov=globeye --cov-report=term-missing"
markers = [
  "e2e: end-to-end scan tests (all sources mocked)",
  "integration: API/CLI integration tests",
  "benchmark: performance benchmarks (informational, non-gating)",
]
filterwarnings = [
  # Known upstream (FastAPI/Starlette) deprecation — not actionable here.
  "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["globeye"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

# ----------------------------------------------------------------------------
# bandit — static security analysis
# ----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
